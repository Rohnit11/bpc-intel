# config/corridor.yaml
# Korea → India K-beauty corridor — first-class research axis (added 2026-07-21)
# Seeded from data/baseline/deep-research-report.md §4.1; every entry there is
# baseline-sourced. New entries require a fetcher run or manual drop.
#
# Tagging convention: any DataPoint about K-beauty inside India carries
# "[CORRIDOR]" in its notes field. Trade-flow data (KR exports, destination
# India) is geography=KR, value_basis=EXPORT_FOB with destination noted.

corridor:
  direction: KR_to_IN
  headline:
    # Baseline: exports to India rose ~44.7% (H1 2025 basis) off ~US$50m base
    trade_base: "~US$50m (H1 2025 basis), +44.7% YoY — small base, fast growth"
    entry_barrier: "CDSCO import registration (Form COS-1 -> COS-2 via SUGAM portal) — pre-clearance before any consignment; key friction and lead-time cost"
    momentum: "K-beauty is accelerating its India entry to offset SWANA-region volatility (Personal Care Insights, Apr 2026). 2026 launches: APR's Medicube (Nykaa + Tira), AmorePacific's Illiyoon (Nykaa exclusive), TirTir (Nykaa, Jun 2026), Tira's Hince (Jan) and Dr. Melaxin (Jul). India K-beauty ~INR 3,139cr (2025) forecast ~26% CAGR to ~INR 32,424cr by 2035 (Expert Market Research). AmorePacific is scaling India via platforms/imports, NOT local manufacturing — no India plant announced."

  conduits:
    - name: Nykaa
      type: platform
      since: 2016
      notes: "Primary conduit; 10-year AmorePacific partnership (2016-2026), India's largest Korean portfolio (skincare/derma/haircare). Illiyoon newest exclusive (2026). Now also carries non-AmorePacific K-brands (TirTir, Medicube)."
      kr_brands_carried:
        - { brand: Innisfree, owner: AmorePacific, launched: 2016 }
        - { brand: Laneige, owner: AmorePacific }
        - { brand: Sulwhasoo, owner: AmorePacific }
        - { brand: COSRX, owner: AmorePacific }
        - { brand: Aestura, owner: AmorePacific, segment: dermocosmetics }
        - { brand: Illiyoon, owner: AmorePacific, segment: dermocosmetics, launched: 2026 }
        - { brand: "Mise En Scène", owner: AmorePacific, segment: hair_care, launched: 2025 }
        - { brand: RYO, owner: AmorePacific, segment: hair_care, launched: 2025 }
        - { brand: TirTir, owner: TirTir, launched: 2026-06, notes: "Mask Fit Red Cushion; independent K-brand, not AmorePacific" }
        - { brand: Medicube, owner: "APR Corporation", segment: dermocosmetics, launched: 2026 }
    - name: Tira (Reliance)
      type: platform
      notes: "Reliance Retail omnichannel beauty platform; aggressive 2026 K-beauty sprint with exclusive launches (online + select stores)"
      kr_brands_carried:
        - { brand: Mixsoon, launched: 2024-08 }
        - { brand: Hince, segment: colour_cosmetics, launched: 2026-01 }
        - { brand: Medicube, owner: "APR Corporation", segment: dermocosmetics, launched: 2026-02 }
        - { brand: "Dr. Melaxin", segment: dermocosmetics, launched: 2026-07, notes: "exclusive to Tira" }
    - name: Flipkart
      type: platform
      notes: "Launched international K-beauty portfolio (source: Flipkart, 2025)"
      kr_brands_carried:
        - { brand: "The Face Shop" }
        - { brand: TirTir }
        - { brand: "Beauty of Joseon" }
        - { brand: "rom&nd" }
        - { brand: "Thank You Farmer" }
        - { brand: "K Glo" }
        - { brand: Soyaang }
        - { brand: "K Riot" }
    - name: Amazon India
      type: platform
      kr_brands_carried:
        - { brand: Anua, owner: "The Founders" }
        - { brand: "Some By Mi" }
        - { brand: Etude, owner: AmorePacific }
        - { brand: Isntree }
        - { brand: "Dr.Jart+" }
        - { brand: "The Face Shop" }
    - name: q-commerce (Blinkit/Zepto/Instamart)
      type: channel
      notes: "Tier 2/3 access rail; masstige-price derma K-beauty via dark stores is the corridor's clearest whitespace per baseline §4.5"

  whitespace:
    # Baseline §4.1 + §4.5 ranked opportunities relevant to the corridor
    - "Mid-price derma K-beauty in Tier 2/3 (baseline whitespace #5, highest corridor conviction)"
    - "Dedicated sunscreens (baseline whitespace #2 — India sun care underpenetrated)"
    - "Men's K-beauty (baseline whitespace #4 — men's skincare underserved vs toiletries)"

  india_side_players:
    # Indian companies operating in the K-beauty segment (the India side of the
    # corridor). Two responses to the Korean wave: (1) platforms racing to
    # curate Korean portfolios (see conduits above), and (2) Indian D2C brands
    # launching Korean-ingredient / "made-in-Korea" lines to win glass-skin
    # demand at local price points.
    dynamic: "Platform land-grab (Nykaa's 10-yr AmorePacific tie-up vs Reliance Tira's 2026 sprint) plus Indian D2C brands going Korean. The competitive line runs incumbent Korean majors (AmorePacific) vs indie K-beauty vs Indian challengers."
    indian_brands:
      - name: Pilgrim
        type: indian_d2c
        angle: "Korean Rice Water range (new launch); markets Korean/global rituals, made-in-India, vegan"
        source_url: "https://discoverpilgrim.com"
      - name: Limese
        type: indian_d2c
        angle: "K-beauty formulations manufactured IN KOREA, tuned for Indian skin (snail mucin, cica, rice, collagen)"
        source_url: "https://t2online.in/goodlife/fashion-beauty/five-indian-skincare-brands-offering-k-beauty-inspired-products-at-affordable-prices/2000109"
      - name: "Foxtale (Hula Hoop)"
        type: indian_d2c
        angle: "Foxtale pivoting D2C -> house of brands; launched Hula Hoop amid Korean-inspired demand"
        source_url: "https://ww.fashionnetwork.com/news/India-s-foxtale-announces-shift-from-d2c-label-to-house-of-brands,1790682.html"

  regulation:
    india_import: "CDSCO, Drugs & Cosmetics Act 1940 + Cosmetics Rules 2020; Form COS-1 application -> COS-2 Registration Certificate via SUGAM portal; manufacturing site registration required; BIS IS 4707 ingredient standards (Part 2 revised Aug 2025); paper filings not accepted as of 2026"
    korea_export_support: "MFDS regulatory-diplomacy MOUs to smooth exports"

  monitoring_queries:
    # These feed lib/fetchers/news_tavily.py and trends_google.py
    tavily:
      - "K-beauty India market growth"
      - "Korean skincare brands India launch"
      - "Nykaa Korean beauty brands"
      - "Tira K-beauty Korean cosmetics"
      - "CDSCO Korean cosmetics import registration"
      - "Korean sunscreen India quick commerce"
      - "AmorePacific India expansion"
      - "Korean beauty Blinkit Zepto India"
    google_trends:
      - { keyword: "Korean skincare", geo: IN }
      - { keyword: "K-beauty", geo: IN }
      - { keyword: "Korean sunscreen", geo: IN }
      - { keyword: "glass skin", geo: IN }
    comtrade:
      hs_codes: ["3303", "3304", "3305", "3306", "3307"]
      reporter: KOR
      partner: IND
