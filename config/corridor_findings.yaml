# config/corridor_findings.yaml
# Qualitative Korea -> India K-beauty corridor findings from the
# corridor-tagged Tavily sweeps (data/raw/tavily_20260722T213101Z.json, the
# 8 India+corridor queries, and data/raw/tavily_corridor_*.json; accessed
# 2026-07-22/23). Complements the structured registry in config/corridor.yaml
# (conduits, brands carried, whitespace, India-side players, regulation
# one-liner); this file holds the competitive, consumer, brand and
# regulatory colour that structure can't capture. Quantitative facts
# (market sizes, shares, growth rates, prices, revenue) are DataPoints, not
# here (see lib/ingest and data/sources.csv). Each item carries a source so
# the corridor brief stays traceable.

competitive_dynamics:
  - text: "AmorePacific's India push predates the Nykaa-exclusive narrative and keeps broadening beyond it: the group entered India in 2013, has since added Reliance's Tira and Tata Cliq's Palette as further retail partners, and its India leadership describes a deliberately phased, 'test the market first' approach to adding brands rather than a full-portfolio rush."
    source: "ETRetail (Economic Times Retail)"
    url: "https://retail.economictimes.indiatimes.com/news/health-and-beauty/amorepacific-group-eyes-40-pc-revenue-from-mbos-in-the-next-3-4-years/104039107"
  - text: "Innisfree was the first Korean cosmetics brand to enter India, and did so via a wholly-owned 100% FDI structure rather than a franchise or local-distributor model — a comparatively capital-intensive entry mode for a first mover, per AmorePacific's then India managing director."
    source: "ETBrandEquity (Economic Times)"
    url: "https://brandequity.economictimes.indiatimes.com/news/marketing/heres-how-south-korean-beauty-brands-are-charming-india/59676848"
  - text: "TirTir's India rollout was sequenced rather than simultaneous: it listed on Tira first (January 2025) and only added Nykaa about a year and a half later (June 2026), framing the Nykaa addition as reaching 'more local consumers' rather than replacing the first platform."
    source: "The Korea Herald"
    url: "https://www.koreaherald.com/article/10785214"
  - text: "Illiyoon's India launch sits inside a bigger corporate bet, not a one-off local SKU call: AmorePacific's November 2024 investor day named Illiyoon, alongside HERA and AESTURA, as one of its next-generation global growth brands, ahead of the India listing that followed."
    source: "Amorepacific (Investor Day announcement)"
    url: "https://www.apgroup.com/int/en/news/2024-11-13-1.html"
  - text: "AmorePacific India's country head said in September 2025 that the group has plans to introduce more products in India and is open to eventually considering local manufacturing there — a longer-term ambition beyond the current platform/import model, though no plant has been announced."
    source: "Livemint"
    url: "https://www.livemint.com/companies/lure-of-the-glass-skin-k-beauty-tirtir-amorepacific-india-nykaa-myntra-etude-pilgrim-axis-y-e-commerce-sugar-cosmetics-11756730298057.html"
  - text: "Quench Botanics, an Indian skincare brand co-founded by actor Kareena Kapoor Khan, brings K-beauty-inspired formulations to India with an explicit mission to adapt ingredients and the multi-step Korean routine for Indian skin and climate — another India-side challenger alongside Pilgrim and Limese."
    source: "t2ONLINE"
    url: "https://t2online.in/goodlife/fashion-beauty/five-indian-skincare-brands-offering-k-beauty-inspired-products-at-affordable-prices/2000109"
  - text: "Put Simply, an Indian skincare brand founded in 2022 after its founder's own acne struggles led him to Korean skincare, was built specifically as a range 'developed in Korea for Indian skin and weather' — part of a broader pattern of Indian founders sourcing formulation and manufacturing directly from Korea rather than only importing finished Korean brands."
    source: "The Nod Mag"
    url: "https://thenodmag.com/content/indian-skincare-brands-made-in-korea"
  - text: "Industry commentary flags platform exclusivity as a coming fault line: as current exclusive agreements for global brands in India expire, quick-commerce players are expected to push for a share of those distribution rights — a dynamic to watch beyond today's Nykaa/Tira conduit split."
    source: "LinkedIn (industry commentary)"
    url: "https://www.linkedin.com/posts/adityagrover24_bpc-category-gmv-on-blinkit-zepto-and-instamart-activity-7413901071603003393-7GT-"

consumer_behaviour:
  - text: "Tier-2/3 and non-metro India are already meaningful K-beauty demand centres, not just a future opportunity: cities like Guwahati and Lucknow show up as substantial contributors to tier-2 sales, with face care the largest category share, and e-commerce platforms report their heaviest non-metro demand from India's northeastern states, where K-pop and Korean-drama fandom runs deepest."
    source: "Credence Research"
    url: "https://www.credenceresearch.com/report/india-k-beauty-product-market"
  - text: "South India is the fastest-growing K-beauty region, led by Bengaluru and Chennai's digitally-fluent tech-sector consumers and students; the regional preference skews toward lightweight gel textures, SPF suited to tropical humidity, and serums that state their active ingredients and efficacy claims plainly rather than relying on generic 'glow' marketing."
    source: "Expert Market Research"
    url: "https://www.expertmarketresearch.com/reports/india-k-beauty-products-market"
  - text: "Northeastern India's Korean-culture affinity goes beyond single-product trial: Innisfree India's own marketing manager describes the region as following the brand's full 10-step Korean skincare routine, not just buying hero SKUs piecemeal."
    source: "ETBrandEquity (Economic Times)"
    url: "https://brandequity.economictimes.indiatimes.com/news/marketing/heres-how-south-korean-beauty-brands-are-charming-india/59676848"
  - text: "Innisfree India's leadership attributes early demand to a broader shift in Indian consumer preference toward natural, chemical-free products — positioning Korean brands as beneficiaries of that shift rather than the ones driving it."
    source: "ETBrandEquity (Economic Times)"
    url: "https://brandequity.economictimes.indiatimes.com/news/marketing/heres-how-south-korean-beauty-brands-are-charming-india/59676848"
  - text: "A broader shift in the Indian beauty aesthetic itself — away from sharp contouring, bold brows and strong lip definition, toward a softer 'natural look' — is cited as an underlying tailwind that makes Korean product philosophy land well with Indian consumers."
    source: "Maekyung Pulse"
    url: "https://pulse.mk.co.kr/news/english/11404917"
  - text: "Price sensitivity, product complexity, and authenticity/counterfeit worries are the most-cited friction points slowing K-beauty adoption in India, even though a large majority of existing users say they intend to use more Korean products and are willing to pay a premium once quality is verified."
    source: "ETRetail (citing Kindlife/Datum Intelligence)"
    url: "https://retail.economictimes.indiatimes.com/news/health-and-beauty/indias-k-beauty-market-forecast-15-billion-by-2030/123190386"
  - text: "Newer science-led entrants are courting Indian consumers on specific, clinically-framed concerns — pigmentation, uneven skin texture, long-term skin health — rather than generic glow/glass-skin messaging; Dr. Melaxin's India launch messaging leans explicitly on this clinically-backed positioning."
    source: "The Economic Times"
    url: "https://m.economictimes.com/industry/services/retail/reliance-retails-tira-unveils-k-beauty-brand-dr-melaxin-in-india-a-revolution-in-science-backed-skincare/articleshow/132535014.cms"

brand_strategy:
  - text: "Korean brands' 'herbal ingredient plus modern science' storytelling maps directly onto India's own pre-existing ayurvedic/herbal beliefs — Belif's chickweed, oat and celandine-based formulations are described as landing with Indian consumers precisely because India already has a deep cultural frame for herbal skincare, so the brand doesn't have to build that association from scratch."
    source: "imnidhi.com"
    url: "https://www.imnidhi.com/blogs-english/peek-into-some-korean-skincare-amp-beauty-brands-in-india"
  - text: "Early Korean entrants used hands-on brand education as a market-entry tactic rather than relying on paid media alone: The Face Shop flew Nykaa's team to Korea to tour its labs and brief its experts, specifically so Nykaa could produce more informed ingredient and innovation content for Indian shoppers; Nykaa credited the resulting brand launches with lifting its skin-care sales, and said digital was the only channel it was betting on to market them."
    source: "ETBrandEquity (Economic Times)"
    url: "https://brandequity.economictimes.indiatimes.com/news/marketing/heres-how-south-korean-beauty-brands-are-charming-india/59676848"
  - text: "India-facing product write-ups frame Korean SKUs around local climate and skin fit rather than generic global claims: Sulwhasoo is positioned against pollution- and stress-dulled skin, Innisfree's Green Tea Seed Serum is framed for humid climates, COSRX and Some By Mi are aimed at oily/acne-prone skin, and Dr. Jart+ and Aestura are framed as fragrance-free options for sensitive skin — a consistent India-specific-fit narrative across otherwise-unrelated brands."
    source: "Smytten"
    url: "https://smytten.com/blogs/skincare/best-k-beauty-brands-india-2026-your-faq-answered"
  - text: "Nykaa's own messaging positions the retailer as having 'catalysed the K-beauty phenomenon' in India rather than simply stocking a trend it discovered — its Illiyoon launch communications lean on the decade-long AmorePacific relationship as the origin story of Korean beauty retail in the country."
    source: "medianews4u.com"
    url: "https://www.medianews4u.com/nykaa-reinforces-korean-beauty-leadership-with-exclusive-launch-of-illiyoon-in-strategic-partnership-with-amorepacific"
  - text: "Flipkart's entry messaging is explicitly mass-access rather than curated-exclusive: it frames its Korean-brand storefront as 'democratising access' to K-beauty rituals 'at accessible price points' for digitally-native shoppers — a different position from Nykaa's and Tira's exclusive-brand curation approach."
    source: "Flipkart (LinkedIn)"
    url: "https://www.linkedin.com/posts/flipkart_flipkart-flipkartbeauty-kbeautyindia-activity-7374374983722139648-3uyp"
  - text: "AmorePacific's global 'Everyone Global' strategic pillar commits to developing region-localised product variants rather than exporting a single global catalogue, and names India explicitly as one of the key markets this localisation push covers."
    source: "Personal Care Insights"
    url: "https://www.personalcareinsights.com/news/amorepacific-global-expansion-strategy.html"
  - text: "Tira's brand messaging for each new Korean exclusive (Hince, Medicube, Dr. Melaxin) follows a consistent house style — 'globally coveted' / 'science-led' partnership language plus an omnichannel 'discovery to delivery' framing — regardless of how the underlying brand positions itself elsewhere."
    source: "Reliance Industries Limited"
    url: "https://www.facebook.com/RelianceIndustriesLimited/posts/media-release-tira-brings-viral-k-beauty-brand-dr-melaxin-to-indialaunches-exclu/1351832203749298"

channel_behaviour:
  - text: "Zepto's own team frames its move into Korean-beauty listings as a deliberate widening from daily essentials to make-up to K-beauty specifically, reframing q-commerce beauty as convenience-driven rather than only last-minute or need-based shopping."
    source: "The Established"
    url: "https://www.theestablished.com/self/beauty/the-rise-and-rise-of-beauty-on-indias-quick-commerce-platforms"
  - text: "Blinkit's beauty push includes direct brand-partner tie-ups — for example with Etude — for quick delivery, rather than only passively listing SKUs sourced through distributors; this is a materially different channel relationship from a marketplace listing."
    source: "NextLeap (Blinkit vs Zepto product teardown)"
    url: "https://assets.nextleap.app/submissions/Blinkit-vs-Zepto-Product-TearDown-82bf9da7-9b75-4dd8-aa3c-e4f345b81b62.pdf"
  - text: "Zepto's own dedicated 'Korean Beauty Skincare Range' storefront returned zero live products when checked — a platform-specific whitespace signal that parallels the thin indie/derma K-brand stocking already seen on Blinkit, suggesting the gap isn't limited to one platform."
    source: "Zepto"
    url: "https://www.zepto.com/uncl/korean-beauty-skincare-range/7a8136cf-2b18-42a8-bf54-b3cfa676aad3"
  - text: "Even where dark-store stocking is thin, marketplace demand signals for the same brands show up elsewhere: COSRX's Advanced Snail 96 Mucin Power Essence carries a six-figure rating count and a fast-moving 'bought in past week' flag on Amazon India, indicating real bestseller traction on marketplace channels even where q-commerce stocking lags."
    source: "Amazon.in"
    url: "https://www.amazon.in/Cosrx-Advanced-Snail-Mucin-Essence/dp/B00PBX3L7K"
  - text: "Beauty of Joseon's Relief Sunscreen is being actively marketed as a viral bestseller through Nykaa's own Instagram content pairing it with make-up products, and through independent Indian creator content — a concrete demand proof point behind sunscreen as a stand-out K-beauty sub-category in India."
    source: "Nykaa (Instagram)"
    url: "https://www.instagram.com/reel/DSmdtEJDWyI"
  - text: "Tira's own positioning leans on deep, pincode-level delivery reach across India as its stated differentiator, framing itself as the access point that brings international brand launches to non-metro India rather than a metro-first premium platform."
    source: "Reliance Industries Limited"
    url: "https://www.facebook.com/RelianceIndustriesLimited/posts/media-release-tira-brings-viral-k-beauty-brand-dr-melaxin-to-indialaunches-exclu/1351832203749298"

regulatory_colour:
  - text: "A CDSCO cosmetics Import Registration Certificate, once granted, is valid for three years from issuance (subject to earlier suspension or cancellation) — a renewal cadence importers need to plan around beyond the initial COS-1 to COS-2 application."
    source: "CDSCO (Frequently Asked Questions on Registration and Import of Cosmetics)"
    url: "https://cdsco.gov.in/opencms/export/sites/CDSCO_WEB/Pdf-documents/cosmetics/FAQs-Cosmetics_New.pdf"
  - text: "CDSCO's own targeted processing window for import-registration applications is 90 days, but the underlying rules allow up to six months, extendable by a further three months in exceptional, recorded circumstances — a wide potential lead-time band for K-beauty entrants to plan launch timing around."
    source: "CDSCO (Frequently Asked Questions on Registration and Import of Cosmetics)"
    url: "https://cdsco.gov.in/opencms/export/sites/CDSCO_WEB/Pdf-documents/cosmetics/FAQs-Cosmetics_New.pdf"
  - text: "Imported cosmetics face an animal-testing compliance step at the port that is separate from upfront registration: under Rule 135B, the manufacturer must give a written undertaking that the product was not tested on animals on or after 12 November 2014, submitted at the time of consignment clearance."
    source: "CDSCO (Frequently Asked Questions on Registration and Import of Cosmetics)"
    url: "https://cdsco.gov.in/opencms/export/sites/CDSCO_WEB/Pdf-documents/cosmetics/FAQs-Cosmetics_New.pdf"
  - text: "A narrow carve-out exists for cosmetics imported in bulk purely for repackaging and 100% re-export: no Registration Certificate is required in that case, but the importer must separately obtain CDSCO HQ permission and give a written undertaking that the goods will not be released for domestic sale."
    source: "CDSCO (Frequently Asked Questions on Registration and Import of Cosmetics)"
    url: "https://cdsco.gov.in/opencms/export/sites/CDSCO_WEB/Pdf-documents/cosmetics/FAQs-Cosmetics_New.pdf"
  - text: "FSSAI has separately flagged quick-commerce platforms for improper storage and handling practices covering cosmetics alongside food — a live compliance friction point for the q-commerce conduit that K-beauty distribution increasingly leans on for Tier 2/3 reach."
    source: "NextLeap (Blinkit vs Zepto product teardown, citing FSSAI)"
    url: "https://assets.nextleap.app/submissions/Blinkit-vs-Zepto-Product-TearDown-82bf9da7-9b75-4dd8-aa3c-e4f345b81b62.pdf"
  - text: "A Korean cosmetics manufacturer cannot import into India directly in its own name — it must appoint an Indian Authorised Agent (a locally established importer, subsidiary, or distributor) who holds the CDSCO registration and is legally answerable to the regulator, making that local entity the actual legal anchor point for compliance rather than the Korean manufacturer itself."
    source: "Statura"
    url: "https://statura.in/blog/how-to-import-korean-cosmetics-k-beauty-to-india-a-complete-step-by-step-guide"
