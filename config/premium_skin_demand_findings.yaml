# config/premium_skin_demand_findings.yaml
# Phase 3 of docs/premium-skincare-brief.md — [PREMIUM-SKIN].
# Is "Korean" load-bearing for the Indian premium skincare buyer, or incidental?
# Who buys at Rs1,500-3,000, and is the band being closed domestically?
# Accessed 2026-08-10.
#
# Same shape and rules as korea_findings.yaml, india_findings.yaml and
# premium_skin_fit_findings.yaml: one entry per finding, each with a source and
# the exact URL that was fetched and read (CLAUDE.md rule 6 — no entry here
# rests on a search snippet). Quantitative claims are DataPoints in
# data/sources.csv, not here; figures appear in prose for context only.
#
# Phase 3 is a POSITIONING input, not a go/no-go (owner's call, 2026-08-09).
# Nothing below kills the concept; several entries change what the brand should
# lead with.
#
# The counted evidence this phase produces — purchase-driver mention rates
# across 3,287 Nykaa reviews, keyed to manufacturer origin — is NOT in this
# file. It is a computed statistic and lives in
# data/manual/analysis/premium_skin_demand.json, with its DataPoints in
# data/sources.csv and its methodology in lib/transforms/premium_skin_demand.py.

who_buys_the_band:
  - text: "The single most useful disclosed number for this band: Nykaa's Beauty average order value was Rs2,173 in Q3FY26 (quarter ended 31-Dec-2025), against Rs2,127 in Q3FY25 — up 2 percent. The Rs1,500-3,000 band is therefore not a premium slice of a basket; ONE in-band SKU is roughly a whole average Nykaa beauty order. Nykaa itself reads rising AOV as premiumisation ('Focus on driving penetration (strong AUTC growth of 26% YoY) and premiumization (AOV improvement of 4% YoY) are driving GMV growth', Q1FY26). The operator consequence is that an in-band launch is not competing for a slot in a basket, it is competing to BE the basket — which makes trial economics, not routine economics, the first constraint."
    source: "Nykaa (FSN E-Commerce Ventures) Q3FY26 investor presentation, Key Performance Metrics p51; Q1FY26 investor presentation p9"
    url: "https://www.nykaa.com/media/wysiwyg/uiTools/2026-2/Investor-Presentation-Q3.pdf"
  - text: "Scale of the online premium buyer pool, from the same filing: Nykaa reported 18.7mn Annual Unique Transacting Customers in Beauty for Q3FY26, up 26 percent YoY, with 18.1mn Beauty orders in the quarter and 50.7mn monthly average unique visitors. Cumulative beauty customers served stood at ~42mn (Anchit Nayar, quoted 2026), and 52mn across all platforms. Nykaa holds roughly 27-29 percent of India's online BPC market. Whatever share of these buyers transacts at Rs1,500-3,000, the addressable online set is tens of millions of transacting customers, not a niche — but the AOV above says most of them are transacting well below the band."
    source: "Nykaa Q3FY26 investor presentation (KPI table p51, p6); BeautyMatter interview with Anchit Nayar; MOFSL initiation note on FSN E-Commerce (Dec-2025), p31"
    url: "https://beautymatter.com/articles/how-nykaa-built-indias-beauty-market"
  - text: "The income structure of Indian BPC demand, and the finding that reframes the band: annual BPC spend per consumer runs USD30 (entry-level earners, <USD3k p.a. income) / 50 (emerging professionals) / 79 (established earners) / 116 (mid-level professionals) / 140 (high-income earners, >USD15k p.a.) — a 5x spread. But annual purchase FREQUENCY across the same five cohorts is 16 / 16 / 17 / 17 / 18. MOFSL's own reading: 'purchase frequency does not necessarily decline with rising income levels; instead, consumers often maintain similar buying intervals while moving up to more premium, value-conscious products.' Premium demand in India is a price-per-unit phenomenon, not a frequency one. That is the strongest available argument FOR a price-led entry — and it caps the size of the prize, because even the top cohort's entire annual BPC budget is about USD140."
    source: "MOFSL initiation note on FSN E-Commerce Ventures (Dec-2025), Exhibit 12 (India BPC annual spend across income levels) and Exhibit 14 (India BPC annual purchase frequency), both credited 'MOFSL, Company'"
    url: "https://bsmedia.business-standard.com/_media/bs/data/market-reports/equity-brokertips/2025-12/17665661370.41111100.pdf"
  - text: "Channel structure, stated because CLAUDE.md rule 8 requires it on every India number: India's BPC market was USD24bn in FY25 split 52 percent unorganised offline / 28 percent organised offline / 20 percent online, moving to 34 / 32 / 34 by FY30E on a USD40-45bn base (~12 percent CAGR). Online BPC GMV goes from ~USD5bn in FY25 to USD14-15bn by FY30E at 23-25 percent. Every price, review and assortment number in this whole premium-skincare thread sits inside the 20 percent online slice — which is the fastest-growing and the most discount-heavy, and is where premium discovery happens, but is one fifth of the market. Offline remains deferred to Phase 4."
    source: "MOFSL initiation note on FSN E-Commerce Ventures (Dec-2025), Exhibits 38-39 and p11, all credited 'Redseer, MOFSL'"
    url: "https://bsmedia.business-standard.com/_media/bs/data/market-reports/equity-brokertips/2025-12/17665661370.41111100.pdf"
  - text: "Age, as far as a disclosed source will carry it: Nykaa's beauty CEO Anchit Nayar describes Gen Z as 'Accounting for 26% of India's population and almost 50% of its consumption' and — directly relevant to Q3 — says 'India's Gen Z population is shaped by Korean beauty and ingredient-led formulations.' Note what that sentence does: it names Korean beauty and ingredient-led formulation in the same breath, as one influence, not two competing ones. It is a platform executive's characterisation, not measured data, and no age split of premium-band transactions is disclosed by any source this phase could fetch."
    source: "BeautyMatter — 'Nykaa and the Rise of India's Beauty Economy', quoting Anchit Nayar"
    url: "https://beautymatter.com/articles/how-nykaa-built-indias-beauty-market"
  - text: "Where premium demand physically sits is still largely an offline question, and the numbers say so: about two-thirds of Nykaa's store GMV comes from premium brands, the store network scaled from 73 stores (FY21) to 265 (1HFY26) across 90 cities, and offline rose from 3.4 percent of BPC GMV in 1QFY22 to 9.0 percent by 3QFY25. Nykaa's own store-format disclosure puts 56 percent penetration of its 116 'Beauty' multi-brand stores in Tier 2 and 3 cities, and 80+ premium brands in its Luxe format. This is the clearest signal yet that Phase 1's online-only verdict on the band is a partial verdict — premium concentrates in exactly the channel this thread has not yet researched."
    source: "MOFSL initiation note on FSN E-Commerce Ventures (Dec-2025), p32 and Exhibits 49-50; Nykaa Q1FY26 investor presentation p15"
    url: "https://www.nykaa.com/media/wysiwyg/uiTools/2025-8/Investor-Presentation-Q1.pdf"

is_korean_load_bearing:
  - text: "The two Indian founders who have actually run this experiment disagree in public, and the disagreement IS the finding. Anirudh Kastia (Put Simply, launched 2022, formulated in Korea): 'Korea is the epicentre of skincare innovation and technology. We marry this technology with the needs of Indian consumers to deliver formulations we believe are superior to other locally produced skincare brands.' Shamika Haldipurkar (D'you, launched 2020, formulated in Korea): 'It does make an impression but is not a lasting consideration factor for a consumer... With an influx of Korean brands that are so readily available, being made in Korea is hardly an edge anymore.' Haldipurkar's position is the one this phase's counted evidence supports, and note her mechanism: the edge decays BECAUSE Korean supply arrived. Provenance was scarce in 2020 and is not scarce in 2026."
    source: "The Nod Mag — 'Indian skincare brands are bringing \"made in Korea\" beauty products home' (Namrata Kedar), quoting Anirudh Kastia and Shamika Haldipurkar"
    url: "https://thenodmag.com/content/indian-skincare-brands-made-in-korea"
  - text: "Search demand in India puts provenance one to two orders of magnitude below mechanism. In a single Google Trends payload for India (so the indices are directly comparable) over the trailing 12 months, mean interest ran: 'sunscreen' 60.2, 'dermatologist' 15.6, 'niacinamide' 12.1, 'vitamin c serum' 9.2, 'korean skincare' 0.6. A second payload ranks the provenance vocabulary itself: 'glass skin' 1.7, 'k beauty' 1.0, 'korean skincare' 0.6, 'korean sunscreen' 0.2, against 'sunscreen' 60.2. Two caveats that matter: the anchor saturates every Indian summer and compresses the small terms into an integer 0-2 index, so read these as orders of magnitude and never as trends; and people search for problems and ingredients rather than for provenance they take for granted, so this bounds the SALIENCE of the term, not the sales power of the fact. Raw series: data/raw/premium_skin_demand_trends_*.json."
    source: "Google Trends via pytrends, geo=IN, timeframe 'today 12-m', fetched by lib/fetchers/premium_skin_demand_trends.py on 2026-08-10 (baskets origin_vs_mechanism, origin_terms). Raw: data/raw/premium_skin_demand_trends_20260810T024944Z.json and _20260810T030616Z.json"
    url: null
  - text: "The brand-level search comparison is the uncomfortable one: over the trailing 12 months in India, 'foxtale' (an Indian D2C brand whose SKUs top out at Rs695 by Phase 1's sweep) indexed at 6.7 against 'beauty of joseon' 1.5 and 'cosrx' 1.4 — roughly 4.5x the two Korean brands that carry the largest in-band assortments. Brand-term indices are highly sensitive to the exact string ('minimalist skincare' returned 0.0, which reflects the phrase and not the brand's demand, since buyers search the bare word 'minimalist'), so this is directional only. Directionally, though, it says the Indian D2C brand commands more search demand from a price tier BELOW the band than the Korean incumbents command inside it."
    source: "Google Trends via pytrends, geo=IN, timeframe 'today 12-m', fetched by lib/fetchers/premium_skin_demand_trends.py on 2026-08-10 (basket korean_vs_homegrown_brands). Raw: data/raw/premium_skin_demand_trends_20260810T030616Z.json"
    url: null
  - text: "What Indian demand actually searches for is acne, then pigmentation — in that order. One comparable payload, trailing 12 months, geo=IN: 'sunscreen' 60.3, 'acne' 32.8, 'pigmentation' 10.9, 'dark spots' 4.5, 'melasma' 2.0. Acne outranks pigmentation by roughly 3x. This lines up with Phase 2's dermatology finding that Indian post-inflammatory hyperpigmentation is overwhelmingly acne-driven and starts young: the customer arrives with acne and acquires a pigmentation problem. A pigmentation-serum hero product is therefore selling the SEQUEL to the concern that brings people to the category, which is an acquisition problem the brief has not yet priced."
    source: "Google Trends via pytrends, geo=IN, timeframe 'today 12-m', fetched by lib/fetchers/premium_skin_demand_trends.py on 2026-08-10 (basket concerns). Raw: data/raw/premium_skin_demand_trends_20260810T024944Z.json"
    url: null
  - text: "Korean supply into India is accelerating through the platform, which is the mechanism behind 'provenance is no longer scarce'. Of the nine global brand launches Nykaa featured in Q3FY26, four are Korean — Fwee ('Trendy South Korean based GenZ focussed cosmetic brand'), Parnell ('Science backed high-performance Korean beauty brand'), Ariul ('Natural focussed Korean brand'), and d'Alba Piedmont ('Premium, vegan K-beauty'). Three of the eight brand descriptions on the equivalent Q1FY26 page are Korean skincare brands. MOFSL's quarterly log of luxury/prestige launches on Nykaa records TIRTIR, Numbuzin and AXIS-Y in 3QFY25 and Dr. Jart and Aestura in 4QFY25-2QFY26, i.e. Korean brands entering through the PRESTIGE slate. Note where they do not appear: Nykaa's ultra-luxury list (Chanel, La Prairie, YSL, Armani, Dr. Barbara Sturm) contains no Korean brand at all. Korean sits in prestige, one rung below luxury — which is exactly the Rs1,500-3,000 rung."
    source: "Nykaa Q3FY26 investor presentation p12; Q1FY26 investor presentation p10; MOFSL initiation note on FSN E-Commerce (Dec-2025), Exhibits 48 and 53"
    url: "https://www.nykaa.com/media/wysiwyg/uiTools/2026-2/Investor-Presentation-Q3.pdf"
  - text: "A platform-structure fact that explains why review language leans on concerns rather than provenance: MOFSL characterises BPC as 'unusually dependent on influence, curation and product education, with discovery often driven by creators, tutorials and concern-led storytelling rather than price', needing 'depth rather than breadth: shade ranges, undertones, formats and skin-type routines'. Nykaa operates 28,000+ affiliates and content creators generating over 1bn impressions, and reports 100k+ influencers/affiliates with 76 percent of social content consumed being creator-made. Discovery in this band is concern-led and creator-mediated — so the positioning question is not 'Korean or not' but which concern the brand is the answer to."
    source: "MOFSL initiation note on FSN E-Commerce Ventures (Dec-2025), p25; Nykaa Q3FY26 investor presentation p16; BeautyMatter interview with Anchit Nayar"
    url: "https://bsmedia.business-standard.com/_media/bs/data/market-reports/equity-brokertips/2025-12/17665661370.41111100.pdf"

the_lane_is_already_occupied:
  - text: "The brief's working concept — formulate in Korea, tune to Indian skin and weather, sell under an Indian brand — has been executed by at least three Indian brands since 2020, and the repo had none of them on file. D'you (Shamika Haldipurkar, launched 2020, single-SKU launch with an 11-active serum), Put Simply (Anirudh Kastia, 2022) and Quench all formulate in Korea. Kastia's stated brief is almost verbatim the owner's: he 'wanted to create a skincare range developed in Korea specifically for Indian skin and weather', and on the climate problem Phase 2 identified as the live failure mode: 'The ingredient mix, textures, and characteristics are carefully selected to suit our skin and weather.' Haldipurkar on the same constraint: 'Weather plays a significant part in the formula's cosmetic and textural elegance.' The lane is not whitespace; it is a lane with incumbents who have four to six years of formulation learning."
    source: "The Nod Mag — 'Indian skincare brands are bringing \"made in Korea\" beauty products home' (Namrata Kedar)"
    url: "https://thenodmag.com/content/indian-skincare-brands-made-in-korea"
  - text: "The two incumbents in that lane straddle the band from opposite ends, and their own price lists are the evidence. D'you sells hustle (all-in-one serum) at Rs3,200, in my defence (barrier moisturiser) Rs3,500, embrace (retinoid night serum) Rs3,400, unkissed (SPF50 PA++++) Rs2,200, good grease (cleansing balm) Rs2,000 and inbalance (milky tonic) Rs1,680, i.e. three SKUs inside the band and three ABOVE it, sold from its own site at full list. Put Simply sells Beat The Sun (SPF50+ PA++++, 50ml) at Rs825 against Rs1,099 list, Ray Away Sunstick Rs899 against Rs1,499, and Daily Affermation Serum Rs899 against Rs1,699 — below the band on both list and street, with only its duos (Rs2,598 and Rs2,798 list) reaching in. Same lane, same manufacturing geography, prices four times apart. Korean formulation does not determine a price point; brand architecture does."
    source: "D'you online store (dyou.co, all products); Put Simply online store (putsimply.co.in)"
    url: "https://dyou.co/collections/all"
  - text: "Put Simply's own storefront is a compact demonstration of what Korean-made brands lead with on Indian shelves, and it corroborates Phase 2 exactly: every sunscreen SKU is sold on 'Zero White Cast' ('Zero White Cast, Non-Greasy'; 'Zero White Cast, Travel Friendly'), and the brand's three-point trust stack reads 'Dermatologically tested / Sensitive skin-friendly / Made in Korea'. White cast is marketed as SOLVED — it is a table-stakes reassurance, not a differentiator — and 'Made in Korea' appears third, after clinical and sensitivity claims. Provenance is used, but as a trust marker behind the mechanism claims, which is precisely the hierarchy the review evidence shows."
    source: "Put Simply online store (putsimply.co.in), product listing and trust claims"
    url: "https://putsimply.co.in"
  - text: "Limese must be re-classified before Phase 4 uses it: Phase 1 listed it as a homegrown brand and flagged it as a coverage gap, but its own site describes an importer and multi-brand retailer of Korean skincare in India — founded by Dale Deugcheon Han, operating Seoul sourcing with Mumbai operations, and carrying By Wishtrend, COSRX, I'M FROM, Dear Klairs, Numbuzin, One Thing, OOTD, P. Calm, Rom&nd and Treecell across 20+ brands and 350+ products. It is a corridor CONDUIT, not a competitor brand, and it belongs in config/corridor.yaml's conduit list rather than in the homegrown competitive set."
    source: "Limese — About Us"
    url: "https://limese.com/pages/about-us"
  - text: "The domestic threat to the band is real but it is not the brands the brief named. Re-keying the Phase 1 price sweep to manufacturer origin (see data/manual/analysis/premium_skin_demand.json) shows 12 Indian-origin brands listing single SKUs in-band on brand-neutral concern queries — RAS Luxury Oils, Suganda, Yuderma, Ethiglo, WildGlow, BiE, The Derma Co, TBC The Bath & Care, Miduty, Fixderma, Aminu, Forest Essentials — while Minimalist, Dot & Key, Foxtale, Pilgrim, Deconstruct, Earth Rhythm and Plum remain absent from the band exactly as Phase 1 found. Two of those Indian in-band brands (RAS Luxury Oils, Suganda) carry the highest concern-and-result review language in the entire corpus. The band is being approached domestically from the dermocosmetic and premium-natural side, not from the mass D2C side."
    source: "bpc-intel Phase 1 price sweep re-keyed to manufacturer origin (lib/transforms/premium_skin_demand.py over data/raw/premium_skin_prices_20260809T184135Z.json, which holds every listing URL fetched on 2026-08-09), plus the Phase 2 review corpus"
    url: null
  - text: "One structural reason the domestic side keeps arriving: more than 800 D2C BPC brands have launched in India since 2020, D2C is already about 15 percent of India's BPC market, and MOFSL expects D2C to compound at 22-27 percent over 2024-2030 — with brands explicitly targeting gaps that large FMCG players leave open, including 'mid-premium price points'. Nykaa's own House of Nykaa brands are 14-18 percent of its BPC GMV, and its acquired D2C skincare brand Dot & Key is at a Rs1,500cr+ GMV run rate and ranks #1 in skin, moisturiser and sunscreen on Nykaa. An entrant in this band is competing against a well-capitalised domestic brand-building machine, with the platform itself as a competitor."
    source: "MOFSL initiation note on FSN E-Commerce Ventures (Dec-2025), p17, Exhibits 54-55; Nykaa Q1FY26 investor presentation p22"
    url: "https://bsmedia.business-standard.com/_media/bs/data/market-reports/equity-brokertips/2025-12/17665661370.41111100.pdf"

what_the_category_is_growing_into:
  - text: "Skincare is the fastest-growing beauty category in the Redseer/MOFSL forecast — 13 percent CAGR against cosmetics 12 percent, fragrances 10 percent and other categories 9 percent over FY25-30 — and premium/prestige is called out as growing 'substantially faster than mass and mastige segments'. Set that against the India BPC deck's LOW-confidence claim of ~22 percent CAGR for the Rs1,500-3,000 tier specifically: the two are not the same measure (all-skincare versus one MRP band), but the 13 percent figure is the more defensible number in the repo and the 22 percent tier figure now has a MEDIUM-confidence neighbour it must be reconciled against before it carries any Phase 4 decision."
    source: "MOFSL initiation note on FSN E-Commerce Ventures (Dec-2025), Exhibit 7 and p31, credited 'Redseer, MOFSL'"
    url: "https://bsmedia.business-standard.com/_media/bs/data/market-reports/equity-brokertips/2025-12/17665661370.41111100.pdf"
  - text: "K-beauty-in-India sizing turns out to be more consistent than expected, and Phase 3's contribution is identifying the outlier rather than adding another guess. The repo already held four estimates that cluster: TheBK/Beauty Kyungjae USD400m (2024) growing 25.9 percent a year to USD1.6bn by 2030 (MEDIUM), Economic Times Retail 25.9 percent 2024-30 (MEDIUM), Expert Market Research INR 3,139.31 crore in 2025 (about USD326m at the pinned FX) at 26.30 percent to 2035 (LOW), and The Report Cubes USD335m in 2026 at 19.17 percent (LOW). Four sources, two of them MEDIUM, agreeing on a level of roughly USD330-400m and growth of 19-26 percent. Against that, Future Market Insights' India figure of 7.4 percent CAGR (2026-2036) is about a third of the bottom of the range, and its own disclosed method explains why: a 'proprietary forecasting model based on Korean cosmetics export data (KITA), global Sephora K-beauty shelf space allocation, and social commerce GMV tracking' — a global shelf-space model apportioned to a country rather than an India measurement. Treat 19-26 percent as the working range and FMI as a discard; the hard number underneath all of it remains the Comtrade customs figure for Korea's HS3304 exports to India (HIGH). Note the scale check this makes possible: USD330-400m of K-beauty against a USD24bn BPC market is 1.4-1.7 percent."
    source: "Future Market Insights — K-Beauty Product Market (India country table), read against the four K-beauty-in-India claims already in data/sources.csv (TheBK/Beauty Kyungjae, Economic Times Retail, Expert Market Research, The Report Cubes)"
    url: "https://www.futuremarketinsights.com/reports/k-beauty-product-market"
  - text: "Korean brands' India push is being driven partly by problems elsewhere, not only by Indian pull — which matters for how durable the corridor is. Personal Care Insights (Apr-2026) reports Korean beauty companies accelerating into India to offset volatility across the SWANA region and stricter EU rules, with APR rolling out Medicube on Nykaa and Amorepacific introducing its dermocosmetic brand Illiyoon; an Innova Market Insights analyst is quoted saying India 'has not been penetrated yet but has strong capabilities of online expansion through e-commerce and quick-commerce channels'. Read as a Phase 4 risk input: the supply of Korean competitors in this band is a function of Korean export diversification, so it can intensify faster than Indian demand grows."
    source: "Personal Care Insights — 'K-beauty targets India as SWANA volatility reshapes expansion strategies' (2 Apr 2026)"
    url: "https://www.personalcareinsights.com/news/kbeauty-expands-india-market.html"
